<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compare Sorting Algorithms</title>

    <!-- Shared styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js CDN (needed for the runtime line‑chart) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Comparison‑page logic -->
    <script src="compare.js" defer></script>
</head>
<body>
    <h1>Algorithm‑to‑Algorithm Comparison</h1>

    <!-- MAIN WRAPPER -->
    <div id="comparison-container">

        <!--‑‑ FORM: choose algos and array size ‑‑‑‑‑‑‑‑‑‑‑‑‑‑-->
        <form id="comparison-form">
            <h2>Select algorithms to compare</h2>

            <div id="algorithm-selection">
                <!--  Checkbox list -->
                <label><input type="checkbox" name="algorithm" value="selection">Selection Sort</label>
                <label><input type="checkbox" name="algorithm" value="insertion">Insertion Sort</label>
                <label><input type="checkbox" name="algorithm" value="bubble">Bubble Sort</label>
                <label><input type="checkbox" name="algorithm" value="shell">Shell Sort</label>
                <label><input type="checkbox" name="algorithm" value="merge">Merge Sort</label>
                <label><input type="checkbox" name="algorithm" value="quick">Quick Sort</label>
                <label><input type="checkbox" name="algorithm" value="heap">Heap Sort</label>
            </div>

            <!-- Array‑size field -->
            <div id="data-size-input">
                <label for="data-size">Array Size (10 – 1000):</label>
                <input type="number" id="data-size" value="200" min="10" max="1000">
            </div>

            <!-- Start button -->
            <button type="button" onclick="startComparison()">Start Comparison</button>
        </form>
        <!--‑‑ END FORM ‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑-->

        <!-- RESULTS (hidden until comparisons complete) -->
        <section id="comparison-results" class="hidden">

            <!-- Runtime‑vs‑N line‑chart -->
            <canvas id="runtimeChart" width="800" height="400"
                    style="display:none; margin:30px auto;"></canvas>

            <!-- Individual algorithm visualizations injected here -->
            <div id="visualization-container" class="visualization-container"></div>

            <!-- Action buttons -->
            <button id="redo-btn" onclick="redoComparison()">Redo Comparison</button>
            <button id="back-btn" onclick="goBack()">Back to Visualizer</button>
        </section>
    </div> <!-- end #comparison-container -->

</body>
</html>
